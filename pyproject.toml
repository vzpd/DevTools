[tool.poetry]
name = "tools"
version = "0.2.3"
description = ""
authors = ["zp"]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.12"
pyside6 = "6.7"
pyinstaller = "^6.6.0"
isort = "^5.13.2"
black = "^24.4.2"
mypy = "^1.10.0"
croniter = "^6.2.4"

pyjwt = "^2.8.0"
tzdata = ">=2024.1"
pyobjc-framework-Cocoa = {version = ">=10,<12", markers = "sys_platform == 'darwin'"}
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[[tool.poetry.source]]
name = "mirrors"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"


[tool.isort]
profile = 'black'
skip_glob = ["proto", "app/rpc/invoker/*"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.env
  | _build
  | buck-out
  | build
  | dist
  | app/rpc/invoker
)/
'''
